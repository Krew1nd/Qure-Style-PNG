name: Sync upstream SVGs to PNG
on:
  schedule:
    - cron: '0 14 * * *' # Daily at 22:00 Asia/Shanghai (14:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-png.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'sync-state.json'
permissions:
  contents: write
concurrency:
  group: upstream-png-sync
  cancel-in-progress: false
jobs:
  workflow-keepalive:
    name: Keep scheduled workflow active
    needs: sync-and-convert
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout latest main after synchronization
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - name: Commit heartbeat only after 45 days without commits
        shell: bash
        run: |
          set -euo pipefail
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          idle_seconds=$((now - last_commit))
          if (( idle_seconds < 45 * 24 * 60 * 60 )); then
            echo 'Recent main-branch commit found; no heartbeat needed.'
            exit 0
          fi
          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit --only .github/keepalive -m 'chore: keep scheduled workflow active'
          git status --short
          git push origin HEAD:main
  sync-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned renderer
        run: npm ci
      - name: Checkout upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aaANDkk/Qure_Style_SVG
          ref: main
          path: .upstream
          persist-credentials: false
      - name: Convert SVG icons to validated PNGs
        run: npm run sync
      - name: Commit only actual changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon/png upstream Other/Qure-Style-PNG.json sync-state.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "sync: convert upstream icons to PNG"
            git push origin HEAD:main
          fi
