<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <title>Amap</title>
  <desc>Qure-style clean bold vector redraw of Amap (高德地图) without interior hairline artifacts; 144x144 canvas with 2px margin.</desc>
  <defs>
    <linearGradient id="amap-grad" gradientUnits="userSpaceOnUse" x1="72" y1="2" x2="72" y2="142">
      <stop offset="0" stop-color="#2BB1FF"/>
      <stop offset="0.5" stop-color="#0091FF"/>
      <stop offset="1" stop-color="#0073D6"/>
    </linearGradient>
    <mask id="amap-cross-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="144" height="144">
      <rect x="0" y="0" width="144" height="144" fill="#FFFFFF"/>
      <!-- Knockout paper airplane silhouette (+ clean 4px halo gap) from crosshair bars behind -->
      <path d="M12.5 72.5 L129.5 18.5 L99.0 131.5 L60.5 106.5 L49.0 121.0 L42.5 92.5 Z" fill="#000000" stroke="#000000" stroke-width="5.5" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Rounded crosshair bars behind the paper airplane -->
  <g stroke="url(#amap-grad)" stroke-width="9.5" stroke-linecap="round" fill="none" mask="url(#amap-cross-mask)">
    <line x1="6.8" y1="53.5" x2="137.2" y2="53.5"/>
    <line x1="98.5" y1="6.8" x2="98.5" y2="137.2"/>
  </g>

  <!-- Crisp bold paper airplane with clean hollow wings and bold center fold crease (NO hairline!) -->
  <path fill="url(#amap-grad)" fill-rule="evenodd" d="M12.5 72.5 L129.5 18.5 L99.0 131.5 L60.5 106.5 L49.0 121.0 L42.5 92.5 Z     M30.5 73.5 L49.5 85.5 L103.5 40.5 Z     M113.5 36.5 L59.5 92.5 L91.8 113.5 Z     M51.5 95.5 L53.2 106.0 L58.5 99.5 Z"/>
</svg>
